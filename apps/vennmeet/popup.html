<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Venn</title>
    <style>
      body {
        margin: 0;
        width: 260px;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #18181a;
        color: #f2f2f2;
      }
      #app { padding: 16px; }
      h1 { font-size: 14px; margin: 0 0 12px; }
      label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #9a9a9a; margin-bottom: 12px; }
      select {
        font: inherit;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #3a3a3d;
        background: #111;
        color: #fff;
      }
      .venn-mode { font-size: 12px; color: #9a9a9a; margin: 0 0 8px; text-transform: capitalize; }
      .venn-status { font-size: 12px; color: #d9a441; margin: 0 0 8px; min-height: 16px; }
      input {
        font: inherit;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #3a3a3d;
        background: #111;
        color: #fff;
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 12px;
      }
      .venn-link-btn {
        font: inherit;
        width: 100%;
        padding: 8px;
        border-radius: 6px;
        border: none;
        background: #2a2a2d;
        color: #fff;
        cursor: pointer;
        margin-bottom: 8px;
      }
      .venn-join-row { display: flex; gap: 6px; margin-bottom: 8px; }
      .venn-join-row input { margin-bottom: 0; text-transform: uppercase; }
      .venn-join-row .venn-link-btn { width: auto; flex-shrink: 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/popup/index.ts"></script>
  </body>
</html>
